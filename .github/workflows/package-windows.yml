# Unsigned Windows NSIS installer.
# Manual / release-validation only — not on every commit.
# A missing code-signing certificate must not fail this job.
name: Package Windows NSIS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package (commit SHA, branch, or tag). Empty uses the workflow file ref.
        required: false
        default: ""
      require_publishable_key:
        description: Fail if PSC_SUPABASE_ANON_KEY is missing (UAT production-pointed build)
        type: boolean
        required: false
        default: false
  # Optional later: push tags such as v0.1.0 — still no GitHub Release publish.
  # push:
  #   tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: package-windows-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  nsis:
    name: Build unsigned NSIS installer
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Record packaged revision
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $short = git rev-parse --short HEAD
          "PACKAGED_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGED_SHORT=$short" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Packaging commit $sha"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend production build
        run: npm run build

      - name: Relevant tests (contracts + cafe-domain)
        shell: pwsh
        run: |
          npx vitest run
          cargo test --manifest-path src-tauri/Cargo.toml -p cafe-domain

      - name: Reject elevated cloud keys before compile
        shell: pwsh
        env:
          PSC_SUPABASE_ANON_KEY: ${{ secrets.PSC_SUPABASE_ANON_KEY }}
          REQUIRE_PUBLISHABLE_KEY: ${{ inputs.require_publishable_key }}
        run: |
          $key = $env:PSC_SUPABASE_ANON_KEY
          if ($key -and ($key.StartsWith('sb_secret_') -or $key -match 'service_role')) {
            throw 'PSC_SUPABASE_ANON_KEY must be a publishable/anon key, never sb_secret or service_role'
          }
          $requireKey = $env:REQUIRE_PUBLISHABLE_KEY -eq 'true'
          if ($requireKey -and -not $key) {
            throw 'PSC_SUPABASE_ANON_KEY is required for this UAT build'
          }
          if ($key) { Write-Host 'Publishable key present for compile-time release config (value not printed)' }
          else { Write-Host 'No compile-time publishable key; release URL default still applies' }

      - name: Build NSIS installer (unsigned)
        id: nsis-build
        # Signing secrets are intentionally unset. Do not fail if CERT/KEY are absent.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          WINDOWS_CERTIFICATE_THUMBPRINT: ""
          PSC_SUPABASE_URL: ${{ secrets.PSC_SUPABASE_URL }}
          PSC_SUPABASE_ANON_KEY: ${{ secrets.PSC_SUPABASE_ANON_KEY }}
        run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Validate installer + record SHA-256
        shell: pwsh
        run: pwsh -File scripts/validate-nsis-artifact.ps1

      - name: Isolated install / upgrade / uninstall smoke
        shell: pwsh
        run: pwsh -File scripts/smoke-nsis-install.ps1

      - name: Upload unsigned NSIS artifact
        if: steps.nsis-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playstation-cafe-nsis-unsigned-${{ env.PACKAGED_SHORT }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            nsis-sha256.txt
            nsis-validation.json
          if-no-files-found: error
          retention-days: 14
