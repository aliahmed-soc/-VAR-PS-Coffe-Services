# Manual hosted schema deploy. Never runs on ordinary commits. Never resets the database.
name: Hosted Supabase migrate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    name: Link and push migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require CLI token, reject project secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing repository secret SUPABASE_ACCESS_TOKEN (Supabase personal access token)."
            echo "The desktop publishable key cannot apply migrations."
            exit 1
          fi
          case "$SUPABASE_ACCESS_TOKEN" in
            sb_secret_*) echo "SUPABASE_ACCESS_TOKEN must not be a project secret key"; exit 1 ;;
          esac

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and push
        run: |
          supabase link --project-ref rbxtxtlssknjioaveytg
          supabase migration list
          supabase db push --linked

      - name: Validate hosted schema
        run: supabase db query --linked < supabase/tests/hosted/validate_schema.sql
