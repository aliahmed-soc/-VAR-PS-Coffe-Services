# Manual hosted schema deploy. Never runs on ordinary commits. Never resets the database.
name: Hosted Supabase migrate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    name: Link and push migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Require deploy credentials, reject project keys
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Missing repository secret(s). Need SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD."
            echo "The desktop publishable key cannot apply migrations."
            exit 1
          fi
          reject() {
            local name="$1"
            local val="$2"
            case "$val" in
              sb_secret_*|sb_publishable_*|*service_role*)
                echo "$name looks like a project API key, not a deploy credential"
                exit 1
                ;;
            esac
          }
          reject SUPABASE_ACCESS_TOKEN "$SUPABASE_ACCESS_TOKEN"
          reject SUPABASE_DB_PASSWORD "$SUPABASE_DB_PASSWORD"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link, inspect, push outstanding migrations, validate
        run: |
          set -euo pipefail
          supabase link --project-ref rbxtxtlssknjioaveytg --yes
          echo "Remote migration history:"
          supabase migration list --linked
          if supabase db push --help 2>/dev/null | grep -q -- '--dry-run'; then
            echo "Dry-run:"
            supabase db push --linked --dry-run
          else
            echo "db push --dry-run not supported; skipping"
          fi
          supabase db query --linked < supabase/tests/hosted/inspect_remote.sql
          supabase db push --linked --yes
          echo "Remote migration history after push:"
          supabase migration list --linked
          supabase db query --linked < supabase/tests/hosted/validate_schema.sql

      - name: Hosted RLS + event acceptance
        env:
          PGHOST: aws-1-eu-west-1.pooler.supabase.com
          PGPORT: "5432"
          PGUSER: postgres.rbxtxtlssknjioaveytg
          PGDATABASE: postgres
          PGSSLMODE: require
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -f supabase/tests/hosted/auth_insert_helper.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/hosted/rls_matrix.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/hosted/auth_insert_helper.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/hosted/event_acceptance.sql

      - name: Drop hosted-test helpers
        if: always()
        env:
          PGHOST: aws-1-eu-west-1.pooler.supabase.com
          PGPORT: "5432"
          PGUSER: postgres.rbxtxtlssknjioaveytg
          PGDATABASE: postgres
          PGSSLMODE: require
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -f supabase/tests/hosted/cleanup_helpers.sql
